    화면에 바로 넣으면(비동기) document.write 가 막히고, iframe srcdoc 은 주소가 about:srcdoc 이라 http 로 불러 https 쪽에서 막혔다(혼합 콘텐츠).
  값은 map.kakao.com 장소 624215116 → 지도공유 → HTML 태그 복사 → 소스 생성하기. 지도 크기는 ?w=&h= 로 받는다.
-->
<style>
html, body { margin: 0; padding: 0; overflow: hidden; background: #f7f8fa; }
.root_daum_roughmap .cont { display: none !important; }
</style>
</head>

<script charset="UTF-8">

  var w = String(q.get('w') || document.documentElement.clientWidth || 640);
  var h = String(q.get('h') || 420);

</script>
